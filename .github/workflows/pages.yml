name: Scrape and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer queued run replaces an older queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Toronto   # scraper picks "this month" from the local clock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Parser tests
        run: npm test

      - name: Scrape schedule
        # Exits non-zero if any single source fails; verify.js decides whether that's fatal.
        run: npm run scrape || echo "::warning::at least one source failed"

      - name: Verify scrape result
        run: node scraper/verify.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
