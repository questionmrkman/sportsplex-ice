name: Scrape and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 30 min, but deliberately NOT at :00/:30: GitHub documents the top of the hour as a
    # high-load time when scheduled runs get delayed or dropped. Off-peak minutes run far more reliably.
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer queued run replaces an older queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Toronto   # scraper picks "this month" from the local clock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Parser tests
        run: npm test

      - name: Scrape schedule
        # Exits non-zero if any single source fails; verify.js decides whether that's fatal.
        run: npm run scrape || echo "::warning::at least one source failed"

      - name: Verify scrape result
        run: node scraper/verify.js

      - name: Stamp asset versions (cache busting)
        # Pages lets browsers cache files for 10 minutes. Versioning the script/style URLs with the
        # commit SHA means a fresh index.html never pairs with a stale app.js or styles.css.
        env:
          VERSION: ${{ github.sha }}
        run: |
          sed -i -E "s#(styles\.css|app\.js)\"#\1?v=${VERSION::8}\"#g" site/index.html
          grep -E 'styles\.css\?v=|app\.js\?v=' site/index.html
          [ "$(grep -cE '(styles\.css|app\.js)\?v=' site/index.html)" -eq 2 ]

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
